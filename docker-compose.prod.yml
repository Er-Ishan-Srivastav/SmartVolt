name: smartvolt-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartvolt
      POSTGRES_USER: ${POSTGRES_USER:-smartvolt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - smartvolt_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartvolt}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/smartvolt
      APP_NAME: "SmartVolt API"
      API_V1_PREFIX: /api/v1
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      DEFAULT_TARIFF_PER_KWH: "8.00"
      GRID_CO2_FACTOR_KG_PER_KWH: "${GRID_CO2_FACTOR_KG_PER_KWH:-0.675}"
      TREE_CO2_ABSORPTION_KG_PER_YEAR: "${TREE_CO2_ABSORPTION_KG_PER_YEAR:-22.0}"
      SIMULATOR_INTERVAL_SECONDS: "${SIMULATOR_INTERVAL_SECONDS:-3600}"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env.production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env.production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env.production}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional autonomous synthetic consumption worker. It is opt-in so a deployment
  # cannot start wallet deductions accidentally; enable with --profile simulator.
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: ["python", "-m", "app.simulator"]
    profiles: ["simulator"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smartvolt}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@db:5432/smartvolt
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      SIMULATOR_ENABLED: "true"
      SIMULATOR_INTERVAL_SECONDS: "${SIMULATOR_INTERVAL_SECONDS:-3600}"
      SIMULATOR_MIN_KWH: "${SIMULATOR_MIN_KWH:-0.05}"
      SIMULATOR_MAX_KWH: "${SIMULATOR_MAX_KWH:-0.50}"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SMARTVOLT_DOMAIN: ${SMARTVOLT_DOMAIN:?Set SMARTVOLT_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - smartvolt_caddy_data:/data
      - smartvolt_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  smartvolt_prod_postgres_data:
  smartvolt_caddy_data:
  smartvolt_caddy_config:
